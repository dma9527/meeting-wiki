user_name = "Your Name"
language = "en"

[providers]
transcription = "mlx_whisper"  # mlx_whisper | openai_compatible | gemini | text
llm = "ollama"                 # ollama | openai_compatible | gemini
live_transcription = "chunked_mlx_whisper"  # chunked_mlx_whisper | openai_compatible | gemini
live_language = "ollama"       # ollama | openai_compatible | gemini
storage = "local"              # local | s3
calendar = "none"              # none | ics
notification = "macos"         # macos | none
task = "none"                  # none | webhook

[mlx_whisper]
model = "mlx-community/whisper-small-mlx"

[ollama]
base_url = "http://127.0.0.1:11434"
model = "qwen3:8b"
timeout_seconds = 300
num_ctx = 32768

[live]
translation_target_language = "zh"
chunk_seconds = 8
overlap_seconds = 2
summary_context_characters = 12000
allow_external_providers = false

[openai_compatible]
base_url = "http://127.0.0.1:11434/v1"
model = "qwen3:8b"
api_key_env = ""
timeout_seconds = 180

[openai_transcription]
base_url = "https://api.openai.com/v1"
model = "whisper-1"
api_key_env = "OPENAI_API_KEY"
timeout_seconds = 600

[gemini]
# Selecting gemini for a capability requires its model; gemini live selectors
# also require live.allow_external_providers = true.
api_key_env = "MEETING_WIKI_GEMINI_API_KEY"
batch_audio_model = ""  # required when providers.transcription = "gemini"
live_model = ""         # required when providers.live_transcription = "gemini"
language_model = ""     # required when providers.llm or live_language = "gemini"
timeout_seconds = 600

[s3]
bucket = ""
prefix = "meeting-wiki/"
region = "us-east-1"
profile = "default"

[ics]
# path = "~/calendar.ics"

[webhook]
url = ""
token_env = ""
allow_private_networks = false

[privacy]
max_private_attendees = 2
private_terms = [
  "1:1", "one-on-one", "career", "skip-level", "manager sync",
  "check-in", "catch-up"
]

[jobs]
max_attempts = 5
backoff_base_seconds = 2
visibility_timeout_seconds = 3600
