name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@820762786026740c76f36085b0efc47a31fe5020 # v7.0.1
      - uses: actions/setup-python@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip==26.2.1 setuptools==84.0.0 wheel==0.48.0
      - run: python -m pip install -e '.[dev]'
      - run: ruff check meeting_wiki tests
      - run: ruff format --check meeting_wiki tests
      - run: pytest
      - run: pip-audit
      - run: python -m pip wheel --no-deps -w dist .

  desktop:
    strategy:
      matrix:
        node: [20, 22]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@820762786026740c76f36085b0efc47a31fe5020 # v7.0.1
      - uses: actions/setup-node@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: node --check main.js
      - run: node --check capture.js
      - run: npm test
      - run: npm audit --audit-level=high

  public-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@820762786026740c76f36085b0efc47a31fe5020 # v7.0.1
      - name: Block internal identifiers, credentials, and meeting artifacts
        run: bash scripts/public-safety-scan.sh
